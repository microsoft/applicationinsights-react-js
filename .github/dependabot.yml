version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cron: "0 9 */14 * *"
      timezone: "America/Los_Angeles"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "cron"
      cron: "0 9 */14 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
